# ============================================================================
# ASTERIA LOOM — entity.properties
# ----------------------------------------------------------------------------
# Maps entity IDs into the `entityId` uniform (Iris/OptiFine), readable by the
# gbuffers and shadow programs. Syntax: `entity.<id> = [<namespace>:]<entity>`.
# IDs are 16-bit (0..65535); Iris reports 65535 for any entity NOT listed here,
# and 0 when no entity.properties exists at all — so a shader must only ever
# test for the IDs it defines, never assume 0 means "some entity".
#
# ---- 10060: FLAT, FLUSH "decal" entities (5.4, ISSUE "item frames vanish") --
# Item frames, glow item frames and paintings are mounted FLUSH against the
# block they hang on, so their backing quad is (near-)coplanar with that block
# face. Two consequences the entity programs must handle explicitly:
#   1. They must be EXEMPT from any vertex displacement (wind sway, normal
#      expansion, shadow/normal bias, ...). Any displacement with a component
#      into the wall pushes them behind the opaque depth already written by the
#      terrain pass and they disappear. gbuffers_entities.vsh applies no
#      displacement today; this tag makes the exemption explicit and permanent
#      so a future displacement cannot silently break them again.
#   2. They must WIN the depth tie against that block face — see the depth
#      priority in gbuffers_entities.vsh.
# IDs are chosen high to stay clear of any future per-mob tagging.
# ============================================================================

entity.10060 = minecraft:item_frame minecraft:glow_item_frame minecraft:painting
