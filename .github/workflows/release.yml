name: release

# Publishes the installable pack zips to the repo's Releases page.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# ...builds BOTH archives and attaches them to release "v0.5.0":
#   * AsteriaLoom-0.5.0.zip          — the default download, macOS-safe
#   * AsteriaLoom-Advanced-0.5.0.zip — Windows/Linux only (ships compute
#     programs; Iris compiles every .csh, and macOS GL 4.1 cannot, so this one
#     will NOT load on macOS)
# `workflow_dispatch` does the same for a manually supplied version, which is
# useful for re-cutting a release whose upload failed.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    # Release branches are an alternative trigger for environments that cannot
    # push tags or dispatch workflows (sandboxed agents, restricted git proxies,
    # tokens without `actions: write`). Pushing `release/v0.5.1` cuts release
    # v0.5.1 from that branch's head — `gh release create` creates the tag itself,
    # so the result is identical to having pushed the tag directly.
    branches:
      - "release/v[0-9]+.[0-9]+.[0-9]+"
      - "release/v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.5.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_REF_NAME}" != "${GITHUB_REF_NAME#release/v}" ]; then
            # release/vX.Y.Z branch -> X.Y.Z
            version="${GITHUB_REF_NAME#release/v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::could not resolve a version to release"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Validate shaders (all profiles x all programs, all targets)
        # The macOS gate: `.csh` anywhere under shaders/ is a hard failure here.
        run: python3 tools/validate.py --target all

      - name: Validate advanced overlay build
        run: python3 tools/validate.py --target advanced --overlay shaders-advanced

      - name: Package installable zips (default + advanced)
        run: python3 tools/package.py --version "${{ steps.version.outputs.version }}" --variant all

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          asset="dist/AsteriaLoom-${VERSION}.zip"
          advanced_asset="dist/AsteriaLoom-Advanced-${VERSION}.zip"
          test -f "${asset}"
          test -f "${advanced_asset}"

          notes=$(printf '%s\n' \
            "## Which download?" \
            "" \
            "### \`AsteriaLoom-${VERSION}.zip\` — **download this one**" \
            "" \
            "The default pack. Works everywhere, **macOS included**. Drop it into \`.minecraft/shaderpacks/\`." \
            "" \
            "### \`AsteriaLoom-Advanced-${VERSION}.zip\` — **Windows/Linux only — will NOT load on macOS**" \
            "" \
            "The same pack plus the compute-shader Advanced tier. Iris compiles every compute program a pack ships, and macOS (OpenGL 4.1) cannot compile compute shaders at all, so this archive fails to load on a Mac with \`Shader compilation failed for compute ...\`. Take it only if you are on Windows or Linux and want the advanced tier." \
            "" \
            "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for what changed.")

          args=(--title "Asteria Loom ${TAG}" --notes "${notes}")
          case "${TAG}" in
            *-*) args+=(--prerelease) ;;
            *) [ "${PRERELEASE:-false}" = "true" ] && args+=(--prerelease) || true ;;
          esac

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${asset}" "${advanced_asset}" --clobber
          else
            gh release create "${TAG}" "${asset}" "${advanced_asset}" "${args[@]}"
          fi
